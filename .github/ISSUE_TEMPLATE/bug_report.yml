name: 不具合報告
description: エクスポート時の問題を報告する
body:
  - type: markdown
    attributes:
      value: |
        この報告は公開されます。個人情報・認証情報・非公開リンクを伏せ、有料素材・元プロジェクト・ログ全文は添付しないでください。
  - type: textarea
    id: versions
    attributes:
      label: 使用環境
      description: エクスポーター・Unity・UniVRM・lilToonと関連プラグインのバージョン。アプリでの問題はVR Vlogのバージョンと端末名。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順・期待した結果・実際の結果
      description: 問題が起きるまでの操作と、どのような違いがあったかを記載してください。
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: エラーの抜粋
      description: 個人名やファイルパスを伏せ、該当部分だけを貼り付けてください。
      render: text
