name: Build VPM Listing

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published, released]

permissions:
  contents: read

concurrency:
  group: listing-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  listPublishDirectory: Website
  pathToCi: ci

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - name: Detect listing changes
        id: paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request
          
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          number = int(event["pull_request"]["number"])
          api = f'{os.environ["GITHUB_API_URL"]}/repos/{os.environ["GITHUB_REPOSITORY"]}/pulls/{number}'
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f'Bearer {os.environ["GITHUB_TOKEN"]}',
              "X-GitHub-Api-Version": "2022-11-28",
          }
          
          def read_api(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          
          def snapshot(pull):
              return (pull["base"]["sha"], pull["head"]["sha"], pull["changed_files"])
          
          before = read_api(api)
          if before["head"]["sha"] != event["pull_request"]["head"]["sha"]:
              raise RuntimeError("PR head changed; use the latest PR check run")
          expected = before["changed_files"]
          if not isinstance(expected, int) or not 0 <= expected <= 3000:
              raise RuntimeError("Cannot safely inspect every PR file")
          files = []
          for page in range(1, (expected + 99) // 100 + 1):
              entries = read_api(f"{api}/files?per_page=100&page={page}")
              if not isinstance(entries, list):
                  raise RuntimeError("Unexpected PR files response")
              files.extend(entries)
          if len(files) != expected or snapshot(read_api(api)) != snapshot(before):
              raise RuntimeError("PR file list is incomplete or changed during inspection")
          
          exact = {".github/workflows/build-listing.yml", "package.json", "source.json", "Tools/check-listing.py", "Tools/test-listing.py"}
          relevant = False
          for entry in files:
              paths = [entry["filename"]]
              if "previous_filename" in entry:
                  paths.append(entry["previous_filename"])
              if not all(isinstance(path, str) for path in paths):
                  raise RuntimeError("Invalid PR filename")
              relevant |= any(path in exact or path.startswith("Website/") for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"relevant={str(relevant).lower()}\n")
          print(f"Inspected {len(files)} files; listing validation required: {relevant}")
          PY

  check-listing-builder:
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ${{ env.pathToCi }}
          clean: false
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Check listing validation failures
        run: python3 Tools/test-listing.py
      - name: Build listing tool
        run: |
          dotnet build "$pathToCi/PackageBuilder/PackageBuilder.csproj" \
            --framework net8.0 \
            --disable-build-servers \
            --maxcpucount:1 \
            /nodeReuse:false \
            /p:UseSharedCompilation=false \
            --nologo
      - name: Generate listing from a local release fixture
        run: |
          fixture=$RUNNER_TEMP/listing-fixture
          mkdir -p "$fixture/release" "$fixture/output"
          cp source.json "$fixture/source.json"
          cp -R Website "$fixture/Website"
          python3 - <<'PY'
          import copy, json, os, zipfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "listing-fixture"
          source = root / "source.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          compatibility = json.loads(Path("Compatibility/dependencies.json").read_text(encoding="utf-8"))
          base = "http://127.0.0.1:8765/listing-fixture/release"
          releases = []
          empty = {"name": data["name"], "id": data["id"], "url": data["url"], "packages": {}}
          variants = [(package["name"], "0.11.11"), (package["name"], package["version"])]
          variants += [(name, compatibility["uniVrm"]["releaseVersion"]) for name in sorted(package["vpmDependencies"])]
          for name, version in variants:
              manifest = copy.deepcopy(package) if name == package["name"] else {"name": name, "displayName": name, "unity": "2022.3"}
              manifest["version"] = version
              path = root / "release" / f"{name}-{version}.zip"
              with zipfile.ZipFile(path, "w") as archive:
                  archive.writestr("package.json", json.dumps(manifest))
              url = f"{base}/{path.name}"
              releases.append({"id": name, "releases": [url]})
          # The pinned builder skips existing URLs without carrying their rows forward.
          # Its supported current-listing parameter makes this a complete rebuild.
          (root / "empty-index.json").write_text(json.dumps(empty), encoding="utf-8")
          data.pop("githubRepos", None)
          data["packages"] = releases
          source.write_text(json.dumps(data), encoding="utf-8")
          PY
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP" >/tmp/vpm-listing-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 5 --retry-connrefused --retry-delay 1 \
            "http://127.0.0.1:8765/listing-fixture/empty-index.json" >/dev/null
          dotnet run \
            --project "$pathToCi/PackageBuilder/PackageBuilder.csproj" \
            --no-build \
            --framework net8.0 \
            -- \
            BuildMultiPackageListing \
            --root "$pathToCi" \
            --package-listing-source-folder "$fixture" \
            --current-listing-url "http://127.0.0.1:8765/listing-fixture/empty-index.json" \
            --list-publish-directory "$fixture/output"
          test -s "$fixture/output/index.json"
          python3 Tools/check-listing.py \
            --listing "$fixture/output/index.json" \
            --expected-version "$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')" \
            --fixture-base-url "http://127.0.0.1:8765/listing-fixture/release"

  listing-validation:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [changes, check-listing-builder]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful listing validation for changed listing files
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LISTING_RELEVANT: ${{ needs.changes.outputs.relevant }}
          BUILDER_RESULT: ${{ needs.check-listing-builder.result }}
        run: |
          python3 - <<'PY'
          import os
          
          if os.environ["CHANGES_RESULT"] != "success":
              raise SystemExit("Listing change detection did not succeed")
          relevant = os.environ["LISTING_RELEVANT"]
          if relevant not in ("true", "false"):
              raise SystemExit("Listing change detection returned no valid decision")
          expected = "success" if relevant == "true" else "skipped"
          actual = os.environ["BUILDER_RESULT"]
          if actual != expected:
              raise SystemExit(f"Listing builder result: {actual}; expected: {expected}")
          print("Listing validation passed" if relevant == "true" else "No listing changes; validation passed")
          PY

  build-listing:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.release.draft == false)
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ${{ env.pathToCi }}
          clean: false
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build listing tool
        run: |
          dotnet build "$pathToCi/PackageBuilder/PackageBuilder.csproj" \
            --framework net8.0 \
            --disable-build-servers \
            --maxcpucount:1 \
            /nodeReuse:false \
            /p:UseSharedCompilation=false \
            --nologo
      - name: Generate VPM listing
        run: |
          empty=$RUNNER_TEMP/listing-empty
          mkdir -p "$empty"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads(Path("source.json").read_text(encoding="utf-8"))
          data = {"name": source["name"], "id": source["id"], "url": source["url"], "packages": {}}
          (Path(os.environ["RUNNER_TEMP"]) / "listing-empty/index.json").write_text(json.dumps(data), encoding="utf-8")
          PY
          # Rebuild the full published history with the pinned builder's existing parameter.
          # No published catalog entries or duplicate dependency versions are merged by us.
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$empty" >/tmp/vpm-listing-empty-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 5 --retry-connrefused --retry-delay 1 \
            "http://127.0.0.1:8765/index.json" >/dev/null
          dotnet run \
            --project "$pathToCi/PackageBuilder/PackageBuilder.csproj" \
            --no-build \
            --framework net8.0 \
            -- \
            BuildMultiPackageListing \
            --root "$pathToCi" \
            --current-listing-url "http://127.0.0.1:8765/index.json" \
            --list-publish-directory "$GITHUB_WORKSPACE/$listPublishDirectory"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify beta and stable packages before deployment
        run: python3 Tools/check-listing.py --listing "$listPublishDirectory/index.json"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ env.listPublishDirectory }}
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
