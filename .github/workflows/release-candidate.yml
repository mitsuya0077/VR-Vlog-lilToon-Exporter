name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full main commit SHA to validate without publishing
        required: true

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: exporter-general-mac-arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require exact main source
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned workflow parser
        run: 'python3 -m pip install --require-hashes --only-binary=:all: -r Tools/pipeline-requirements.txt'
      - name: Lint workflows with a pinned binary
        run: python3 Tools/run-actionlint.py
      - name: Run complete host validation
        run: python3 Tools/run-validation.py --report work/validation.json
      - name: Build and inspect the candidate
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 Tools/build-release-candidate.py --expected-commit "$EXPECTED_COMMIT" --report work/validation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}
          path: work/candidate
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
