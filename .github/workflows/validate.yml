name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 Tools/validate.py
      - name: Run exporter behavior checks
        shell: pwsh
        run: ./Tools/run-behavior-tests.ps1
      - name: Run material bake preflight checks
        shell: pwsh
        run: ./Tools/run-bake-tests.ps1
      - name: Run NDMF preparation ownership checks
        shell: pwsh
        run: ./Tools/run-ndmf-preparation-tests.ps1
