name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 Tools/validate.py
      - run: python3 Tools/check-public-content.py
      - run: python3 Tools/test-package.py
      - name: Check dependency compatibility
        run: |
          python3 Tools/generate-compatibility.py
          python3 Tools/test-compatibility-tooling.py
      - name: Exercise dependency selection and unsupported environments
        shell: pwsh
        run: ./Tools/run-compatibility-tests.ps1
      - name: Run exporter behavior checks
        shell: pwsh
        run: ./Tools/run-behavior-tests.ps1
      - name: Validate optional humanoid pose contract
        shell: pwsh
        run: ./Tools/run-pose-contract-tests.ps1
      - name: Run material bake preflight checks
        shell: pwsh
        run: ./Tools/run-bake-tests.ps1
      - name: Run NDMF preparation ownership checks
        shell: pwsh
        run: ./Tools/run-ndmf-preparation-tests.ps1
