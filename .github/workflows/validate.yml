name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned workflow parser
        run: 'python3 -m pip install --require-hashes --only-binary=:all: -r Tools/pipeline-requirements.txt'
      - name: Lint workflows with a pinned binary
        run: python3 Tools/run-actionlint.py
      - name: Run complete host validation
        run: python3 Tools/run-validation.py --report work/validation.json
